name: Build iOS IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova globally
        run: npm install -g cordova

      - name: Initialize Project Context Shell
        run: |
          cordova create myApp com.vibe.snaptrainer "SnapTrainer"
          cd myApp
          cordova platform add ios
          rm -rf www/*
          cp ../index.html www/
          cordova prepare ios

      - name: Compile App via Direct Architecture Build
        run: |
          cd myApp/platforms/ios
          # Clear out Xcode caches to isolate compilation components perfectly
          rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          
          # Direct compilation targeted for devices that completely bypasses code signing and team verification blocks
          xcodebuild -project "SnapTrainer.xcodeproj" -scheme "SnapTrainer" -sdk iphoneos -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      - name: Package App Bundle into Free IPA Archive
        run: |
          mkdir -p Payload
          
          # Locate the cleanly generated app binary folder from the default build output path
          cp -r myApp/platforms/ios/build/Debug-iphoneos/"SnapTrainer.app" Payload/
          
          # Compress folder payload structure directly into the target .ipa file
          zip -r SnapTrainer.ipa Payload

      - name: Deliver Finished IPA File Archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: SnapTrainer.ipa
