name: Build iOS IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova globally
        run: npm install -g cordova

      - name: Initialize Project Context Shell
        run: |
          cordova create myApp com.vibe.snaptrainer "SnapTrainer"
          cd myApp
          cordova platform add ios
          rm -rf www/*
          cp ../index.html www/
          cordova prepare ios
          
          # Copilot Verification Step 1: Confirm Cordova built the platform folder layout
          echo "=== Verifying Generated Cordova Platforms Directory ==="
          ls -la platforms/ios/

      - name: Compile App via Direct Architecture Build
        run: |
          cd myApp/platforms/ios
          
          # Copilot Verification Step 2: List current contents to trace what project name was used
          echo "=== Debugging Workspace Directory Trees ==="
          ls -la
          
          # Dynamically detect whatever xcodeproj file Cordova actually generated (e.g. App.xcodeproj or SnapTrainer.xcodeproj)
          PROJECT_FILE=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          
          if [ -z "$PROJECT_FILE" ]; then
            echo "Error: No Xcode project folder (.xcodeproj) found in myApp/platforms/ios!"
            ls -la ../../
            exit 1
          fi
          
          PROJECT_NAME=$(echo "$PROJECT_FILE" | sed 's/\.xcodeproj//')
          echo "Found active project target name: $PROJECT_NAME"
          
          # Clear out Xcode caches to isolate compilation components perfectly
          rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          
          # Direct compilation targeted for devices that completely bypasses code signing and team verification blocks
          xcodebuild -project "$PROJECT_NAME.xcodeproj" -scheme "$PROJECT_NAME" -sdk iphoneos -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      - name: Package App Bundle into Free IPA Archive
        run: |
          mkdir -p Payload
          cd myApp/platforms/ios
          PROJECT_FILE=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          PROJECT_NAME=$(echo "$PROJECT_FILE" | sed 's/\.xcodeproj//')
          cd ../../..
          
          # Move the dynamically named native application container bundle into the deployment package
          cp -r myApp/platforms/ios/build/Debug-iphoneos/"$PROJECT_NAME.app" Payload/
          zip -r SnapTrainer.ipa Payload

      - name: Deliver Finished IPA File Archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: SnapTrainer.ipa
