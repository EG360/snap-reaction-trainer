name: Build iOS IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova globally
        run: npm install -g cordova

      - name: Initialize Project Context Shell
        run: |
          cordova create myApp com.vibe.snaptrainer "SnapTrainer"
          cd myApp
          cordova platform add ios
          rm -rf www/*
          cp ../index.html www/
          cp ../build.json ./
          cordova prepare ios

      - name: Compile and Export Native iOS IPA Archive
        run: |
          cd myApp
          # Clear old Xcode caches to prevent module collision loops
          rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          
          # Run the official Cordova device compiler command
          cordova build ios --device --debug --buildConfig=build.json
          
          # Bundle the cleanly packaged app artifact
          cd platforms/ios/build/device
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r ../../../../SnapTrainer.ipa Payload

      - name: Deliver Finished IPA File Archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: SnapTrainer.ipa
