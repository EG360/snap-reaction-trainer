name: Build iOS IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova globally
        run: npm install -g cordova

      - name: Create Cordova App Shell
        run: |
          cordova create myApp com.vibe.snaptrainer "SnapTrainer"
          cd myApp
          cordova platform add ios
          rm -rf www/*
          cp ../index.html www/
          cordova prepare ios

      - name: Compile Native iOS Application
        run: |
          cd myApp/platforms/ios
          # Automatically find the generated project name
          PROJECT_NAME=$(ls -d *.xcodeproj | sed 's/\.xcodeproj//')
          echo "Building project: $PROJECT_NAME"
          xcodebuild -project "$PROJECT_NAME.xcodeproj" -scheme "$PROJECT_NAME" -sdk iphoneos -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      - name: Package App Bundle into IPA Archive
        run: |
          mkdir -p Payload
          cd myApp/platforms/ios
          PROJECT_NAME=$(ls -d *.xcodeproj | sed 's/\.xcodeproj//')
          cd ../../..
          cp -r myApp/platforms/ios/build/Debug-iphoneos/"$PROJECT_NAME.app" Payload/
          zip -r SnapTrainer.ipa Payload

      - name: Deliver Finished IPA File
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: SnapTrainer.ipa
